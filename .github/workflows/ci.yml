name: CI

on:
  push:
    branches: [main]
  pull_request:

# En un PR, un push nuevo cancela la ejecución anterior. En `main` NO (DX-251,
# TST-028): cada merge tiene su propia run completa. El grupo lleva el sha en
# los push para que una run de main tampoco quede «pendiente» y se cancele al
# entrar el siguiente merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # DX-338 (TST-039): el lint va en su PROPIO job. En el merge de DX-291 ESLint
  # se quedó sin heap (exit 134) y, al ir en el mismo job, tsc, unit y build
  # salieron `skipped`: ahora un rojo del lint no oculta nada más. Además
  # muestra su duración y su memoria máxima (`/usr/bin/time -v`) y las reglas
  # más lentas (TIMING), para ver si vuelve a crecer.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      # `npm run lint` lleva --fix (reescribiría y "pasaría"); en CI solo se
      # comprueba. Tras DX-338 cabe en ~2 GB de heap (antes pasaba de 4 GB); el
      # límite explícito no depende de la RAM del runner y deja margen.
      - name: lint:check
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          TIMING: '1'
        run: |
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -v npm run lint:check
          else
            time npm run lint:check
          fi

  # Tipos, unit y build: cada paso corre aunque falle el anterior (solo
  # dependen de `npm ci` y `prisma generate`), así un rojo en uno no deja los
  # demás `skipped` (DX-338).
  checks:
    name: Tipos, unit y build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Generar el cliente de Prisma
        id: prisma
        run: npx prisma generate
      # Avisos de seguridad en dependencias de producción (DX-080). Nivel
      # `critical` y no `high` a propósito: quedan 3 altos que sólo se arreglan
      # con un salto mayor (prisma 7: prisma -> @prisma/config -> deepmerge-ts
      # < 8, GHSA-ggr8-5vv4-36mx, que afecta a la carga de config del CLI, no al
      # runtime). Subir a `--audit-level=high` cuando se migre a prisma 7.
      - name: Auditar dependencias de producción
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=critical
      - name: tsc --noEmit
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: npx tsc --noEmit
      - name: Unit (npm test)
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: npm test
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: npm run build

      # `start:prod` ejecuta `node dist/main`: el build debe dejar ahí la entrada
      # (tsconfig.build.json compila solo src/; si entrara prisma/ o test/, la
      # salida pasaría a dist/src/ y producción no arrancaría).
      - name: Comprobar la entrada de start:prod
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: test -f dist/main.js

  # DX-251 (TST-028): integración y e2e en jobs SEPARADOS, cada uno con su
  # Postgres y su S3: un rojo en `test:int` ya no impide ver la e2e, y los dos
  # informan su resultado en cada run.
  integration:
    name: Integración (Postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dentalix
          POSTGRES_PASSWORD: dentalix
          POSTGRES_DB: dentalix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dentalix -d dentalix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores SOLO de test, ficticios: no son secretos reales ni deben serlo.
      # Misma forma que el `.env.test` local (owner `dentalix` para migrar,
      # rol `dentalix_app` sin privilegios para que la app corra bajo RLS).
      DATABASE_URL: postgresql://dentalix_app:dentalix_app@localhost:5432/dentalix_test?schema=public
      DIRECT_URL: postgresql://dentalix:dentalix@localhost:5432/dentalix_test?schema=public
      # Secretos JWT ficticios y públicos: ≥32 caracteres y distintos para pasar
      # la validación del arranque; la marca "solo-test" hace que la API los
      # rechace con NODE_ENV=production.
      JWT_ACCESS_SECRET: solo-test-ci-access-4f1d9b2e7a6c3058e1b4d7a0c9f2e6b3
      JWT_REFRESH_SECRET: solo-test-ci-refresh-8c2a5e9f1b7d4063a2e5c8f1b4d7a0e9
      JWT_ACCESS_TTL: 900s
      JWT_REFRESH_TTL: 30d
      EXCHANGE_APP_ID: ''
      EXCHANGE_BASE_URL: https://openexchangerates.org/api
      TENANT_BASE_DOMAINS: dentalix.app,localhost
      TRUST_PROXY: 'false'
      STORAGE_DIR: ./storage-test
      FILES_PUBLIC_BASE_URL: http://localhost:3000/api/v1/files
      # DX-084: S3 de prueba (MinIO) del paso «Levantar S3 de prueba». Con
      # REQUIRE_S3_TESTS=1 los tests de S3 fallan si falta S3_TEST_ENDPOINT en
      # vez de saltarse. Credenciales SOLO de test, las de docker-compose.
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_BUCKET: dentalix-test
      S3_TEST_ACCESS_KEY_ID: dentalix-minio
      S3_TEST_SECRET_ACCESS_KEY: dentalix-minio-local
      REQUIRE_S3_TESTS: '1'
      # DX-082: con REQUIRE_BACKUP_TESTS=1 los tests de copias y restauración
      # (test/backup) fallan si falta pg_dump, age o un superusuario, en vez de
      # saltarse. `dentalix` es el superusuario del servicio postgres:16.
      REQUIRE_BACKUP_TESTS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # DX-082: age cifra las copias; no viene en el runner (pg_dump y
      # pg_restore 16 sí).
      - name: Instalar age (copias, DX-082)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends age
          age --version && pg_dump --version

      # DX-084/DX-251: MinIO como paso y no como `services:` (la imagen necesita
      # `server /data`, que un servicio de Actions no puede pasar). Imagen fijada
      # por digest en el script. Si no se puede descargar o no arranca, el paso
      # queda en ROJO con un error que lo dice, pero los pasos siguientes corren
      # igual: solo los tests de S3 fallan por ello, el resto informa.
      - name: Levantar S3 de prueba (MinIO)
        id: s3
        run: .github/scripts/start-test-s3.sh

      # Los servicios de Actions no montan /docker-entrypoint-initdb.d: se aplica
      # a mano el mismo script que usa docker-compose (rol RLS + default privileges).
      - name: Crear el rol de la app (docker/db-init)
        if: ${{ !cancelled() && (success() || steps.s3.outcome == 'failure') }}
        env:
          PGPASSWORD: dentalix
        run: psql -v ON_ERROR_STOP=1 -h localhost -U dentalix -d dentalix_test -f docker/db-init/01-app-role.sql

      # Los scripts de test leen `.env.test` (dotenv -e); se genera desde el env del job.
      - name: Generar .env.test
        if: ${{ !cancelled() && (success() || steps.s3.outcome == 'failure') }}
        run: |
          for k in DATABASE_URL DIRECT_URL JWT_ACCESS_SECRET JWT_REFRESH_SECRET \
                   JWT_ACCESS_TTL JWT_REFRESH_TTL EXCHANGE_APP_ID EXCHANGE_BASE_URL \
                   TENANT_BASE_DOMAINS TRUST_PROXY STORAGE_DIR FILES_PUBLIC_BASE_URL \
                   S3_TEST_ENDPOINT S3_TEST_BUCKET S3_TEST_ACCESS_KEY_ID \
                   S3_TEST_SECRET_ACCESS_KEY; do
            printf '%s="%s"\n' "$k" "${!k}"
          done > .env.test

      - name: Migrar y sembrar la base de test (db:test:setup)
        id: db
        if: ${{ !cancelled() && (success() || steps.s3.outcome == 'failure') }}
        run: npm run db:test:setup
      # DX-134: la comprobación del runbook tras desplegar (README).
      - name: Comprobar FORCE tras migrar (db:check-force)
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: npm run db:check-force
      - name: test:int
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: npm run test:int

  # DX-495 (TST-062): fronteras de calendario. El cambio de mes del 31-10 al
  # 01-11 dejó en rojo `test:int` (DX-491) y la medianoche de la sede de los
  # fixtures (00:00 de Bogotá, 05:00 UTC) ya lo había hecho con la e2e
  # (DX-449): ningún job corría los tests con la hora en una frontera. Este
  # corre la unit y la integración con la hora fijada a:
  #   - fin-de-mes:      el último día 31 ya empezado, 23:59:30 UTC (sin diciembre);
  #   - medianoche-sede: el día 1 del mes en curso, 05:01 UTC (00:01 en Bogotá);
  #   - fin-de-anio:     el 31 de diciembre más cercano, 23:59:30 UTC.
  # Las fechas salen de `calendarBoundary` (test/support/calendar-clock.ts).
  # La unit fija SOLO el `Date` de jest (FAKE_NOW, en proceso). La integración
  # no puede: Postgres (`now()`, los DEFAULT) y el motor de Prisma leen el reloj
  # del sistema, y con el `Date` de jest adelantado y el de la BD no, salen
  # rojos que no existen (colas, recordatorios, CHECK de «no en el futuro»).
  # Por eso, para `test:int`, se fija el reloj del runner, que comparten Node,
  # Prisma y el contenedor de Postgres, y se devuelve a su hora al final.
  calendar-boundaries:
    name: Fronteras de calendario (${{ matrix.boundary }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        boundary: [fin-de-mes, medianoche-sede, fin-de-anio]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dentalix
          POSTGRES_PASSWORD: dentalix
          POSTGRES_DB: dentalix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dentalix -d dentalix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: UTC
      # Valores SOLO de test, ficticios (como en el job de integración). Sin
      # S3 ni herramientas de copias: esos tests se saltan aquí (no dependen
      # de la fecha) y corren en «Integración».
      DATABASE_URL: postgresql://dentalix_app:dentalix_app@localhost:5432/dentalix_test?schema=public
      DIRECT_URL: postgresql://dentalix:dentalix@localhost:5432/dentalix_test?schema=public
      JWT_ACCESS_SECRET: solo-test-ci-access-4f1d9b2e7a6c3058e1b4d7a0c9f2e6b3
      JWT_REFRESH_SECRET: solo-test-ci-refresh-8c2a5e9f1b7d4063a2e5c8f1b4d7a0e9
      JWT_ACCESS_TTL: 900s
      JWT_REFRESH_TTL: 30d
      EXCHANGE_APP_ID: ''
      EXCHANGE_BASE_URL: https://openexchangerates.org/api
      TENANT_BASE_DOMAINS: dentalix.app,localhost
      TRUST_PROXY: 'false'
      STORAGE_DIR: ./storage-test
      FILES_PUBLIC_BASE_URL: http://localhost:3000/api/v1/files
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Generar el cliente de Prisma
        id: prisma
        run: npx prisma generate

      - name: Hora de la frontera
        id: boundary
        run: |
          at="$(npx ts-node -T -e "import { calendarBoundary } from './test/support/calendar-clock'; console.log(calendarBoundary('${{ matrix.boundary }}'))")"
          echo "at=$at" >> "$GITHUB_OUTPUT"
          echo "Frontera ${{ matrix.boundary }}: $at"

      - name: Unit (npm test) con FAKE_NOW en la frontera
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        env:
          FAKE_NOW: ${{ steps.boundary.outputs.at }}
        run: npm test

      - name: Crear el rol de la app (docker/db-init)
        id: role
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        env:
          PGPASSWORD: dentalix
        run: psql -v ON_ERROR_STOP=1 -h localhost -U dentalix -d dentalix_test -f docker/db-init/01-app-role.sql

      - name: Generar .env.test
        if: ${{ !cancelled() && steps.role.outcome == 'success' }}
        run: |
          for k in DATABASE_URL DIRECT_URL JWT_ACCESS_SECRET JWT_REFRESH_SECRET \
                   JWT_ACCESS_TTL JWT_REFRESH_TTL EXCHANGE_APP_ID EXCHANGE_BASE_URL \
                   TENANT_BASE_DOMAINS TRUST_PROXY STORAGE_DIR FILES_PUBLIC_BASE_URL; do
            printf '%s="%s"\n' "$k" "${!k}"
          done > .env.test

      - name: Migrar y sembrar la base de test (db:test:setup)
        id: db
        if: ${{ !cancelled() && steps.role.outcome == 'success' }}
        run: npm run db:test:setup

      # Sin sincronización (chrony/timesyncd la devolverían a la hora real) y
      # con la hora real y el uptime anotados para devolverla al final.
      - name: Fijar el reloj del runner en la frontera
        id: clock
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: |
          echo "REAL_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          echo "REAL_UPTIME=$(cut -d. -f1 /proc/uptime)" >> "$GITHUB_ENV"
          sudo systemctl stop chrony.service systemd-timesyncd.service 2>/dev/null || true
          sudo timedatectl set-ntp false 2>/dev/null || true
          sudo date -u -s "${{ steps.boundary.outputs.at }}"
          date -u
          test "$(date -u +%Y-%m-%d)" = "$(echo '${{ steps.boundary.outputs.at }}' | cut -c1-10)"

      - name: test:int con el reloj en la frontera
        if: ${{ !cancelled() && steps.clock.outcome == 'success' }}
        run: npm run test:int

      - name: Devolver el reloj del runner a la hora real
        if: ${{ always() && steps.clock.outcome != 'skipped' }}
        run: |
          now=$(( REAL_EPOCH + $(cut -d. -f1 /proc/uptime) - REAL_UPTIME ))
          sudo date -u -s "@$now"
          sudo timedatectl set-ntp true 2>/dev/null || true
          sudo systemctl start chrony.service 2>/dev/null || true
          date -u

  # DX-396 (TST-044): la e2e en serie pasaba de 18 min y GitHub la cancelaba a
  # los 20, y «cancelled» escondía rojos. Ahora va repartida con `jest --shard`
  # en una matriz: mismos servicios, env y pasos en cada shard. `total` y
  # `timeout` son de un solo valor (no multiplican jobs) para que el número de
  # shards y el tope vivan en un único sitio. Tope: ~9 min por shard medidos →
  # 20 min deja más del 40 % de margen; el último paso avisa al pasar del 70 %.
  # `e2e-shards` comprueba que cada spec corre en exactamente un shard.
  e2e:
    name: E2E ${{ matrix.shard }}/${{ matrix.total }} (Postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]
        timeout: [20]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dentalix
          POSTGRES_PASSWORD: dentalix
          POSTGRES_DB: dentalix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dentalix -d dentalix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores SOLO de test, ficticios: no son secretos reales ni deben serlo.
      # Misma forma que el `.env.test` local (owner `dentalix` para migrar,
      # rol `dentalix_app` sin privilegios para que la app corra bajo RLS).
      DATABASE_URL: postgresql://dentalix_app:dentalix_app@localhost:5432/dentalix_test?schema=public
      DIRECT_URL: postgresql://dentalix:dentalix@localhost:5432/dentalix_test?schema=public
      # Secretos JWT ficticios y públicos: ≥32 caracteres y distintos para pasar
      # la validación del arranque; la marca "solo-test" hace que la API los
      # rechace con NODE_ENV=production.
      JWT_ACCESS_SECRET: solo-test-ci-access-4f1d9b2e7a6c3058e1b4d7a0c9f2e6b3
      JWT_REFRESH_SECRET: solo-test-ci-refresh-8c2a5e9f1b7d4063a2e5c8f1b4d7a0e9
      JWT_ACCESS_TTL: 900s
      JWT_REFRESH_TTL: 30d
      EXCHANGE_APP_ID: ''
      EXCHANGE_BASE_URL: https://openexchangerates.org/api
      TENANT_BASE_DOMAINS: dentalix.app,localhost
      TRUST_PROXY: 'false'
      STORAGE_DIR: ./storage-test
      FILES_PUBLIC_BASE_URL: http://localhost:3000/api/v1/files
      # DX-084: S3 de prueba (MinIO) del paso «Levantar S3 de prueba». Con
      # REQUIRE_S3_TESTS=1 los tests de S3 fallan si falta S3_TEST_ENDPOINT en
      # vez de saltarse. Credenciales SOLO de test, las de docker-compose.
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_BUCKET: dentalix-test
      S3_TEST_ACCESS_KEY_ID: dentalix-minio
      S3_TEST_SECRET_ACCESS_KEY: dentalix-minio-local
      REQUIRE_S3_TESTS: '1'
    steps:
      # Epoch del arranque: lo lee el paso final que publica la duración.
      - name: Marcar el inicio del job
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # La lista de specs de ESTE shard (rutas relativas, una por línea), para
      # que `e2e-shards` compruebe la unión. Se sube aunque fallen los tests.
      - name: Specs del shard
        run: |
          npx jest --config ./test/jest-e2e.json --listTests \
            --shard=${{ matrix.shard }}/${{ matrix.total }} \
            | sed "s|^$GITHUB_WORKSPACE/||" | sort > e2e-shard-${{ matrix.shard }}.txt
          echo "Shard ${{ matrix.shard }}/${{ matrix.total }}: $(wc -l < e2e-shard-${{ matrix.shard }}.txt) specs"
          cat e2e-shard-${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: e2e-shard-${{ matrix.shard }}.txt
          if-no-files-found: error
          retention-days: 7

      # DX-084/DX-251: MinIO como paso y no como `services:` (la imagen necesita
      # `server /data`, que un servicio de Actions no puede pasar). Imagen fijada
      # por digest en el script. Si no se puede descargar o no arranca, el paso
      # queda en ROJO con un error que lo dice, pero los pasos siguientes corren
      # igual: solo los tests de S3 fallan por ello, el resto informa.
      - name: Levantar S3 de prueba (MinIO)
        id: s3
        run: .github/scripts/start-test-s3.sh

      # Los servicios de Actions no montan /docker-entrypoint-initdb.d: se aplica
      # a mano el mismo script que usa docker-compose (rol RLS + default privileges).
      - name: Crear el rol de la app (docker/db-init)
        if: ${{ !cancelled() && (success() || steps.s3.outcome == 'failure') }}
        env:
          PGPASSWORD: dentalix
        run: psql -v ON_ERROR_STOP=1 -h localhost -U dentalix -d dentalix_test -f docker/db-init/01-app-role.sql

      # Los scripts de test leen `.env.test` (dotenv -e); se genera desde el env del job.
      - name: Generar .env.test
        if: ${{ !cancelled() && (success() || steps.s3.outcome == 'failure') }}
        run: |
          for k in DATABASE_URL DIRECT_URL JWT_ACCESS_SECRET JWT_REFRESH_SECRET \
                   JWT_ACCESS_TTL JWT_REFRESH_TTL EXCHANGE_APP_ID EXCHANGE_BASE_URL \
                   TENANT_BASE_DOMAINS TRUST_PROXY STORAGE_DIR FILES_PUBLIC_BASE_URL \
                   S3_TEST_ENDPOINT S3_TEST_BUCKET S3_TEST_ACCESS_KEY_ID \
                   S3_TEST_SECRET_ACCESS_KEY; do
            printf '%s="%s"\n' "$k" "${!k}"
          done > .env.test

      - name: Migrar y sembrar la base de test (db:test:setup)
        id: db
        if: ${{ !cancelled() && (success() || steps.s3.outcome == 'failure') }}
        run: npm run db:test:setup
      - name: test:e2e (shard ${{ matrix.shard }}/${{ matrix.total }})
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ matrix.total }}
      # SEC-046: la prueba de carga de la importación (20 lecturas en paralelo,
      # pico de RSS < +300 MB) va aparte porque tarda ~1 min; fuera de CI solo
      # corre con RUN_SLOW_TESTS=1. Corre solo en el shard al que le toca su
      # spec (`jest --shard` no reparte una lista de un único fichero).
      - name: test:e2e de carga (SEC-046)
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        env:
          RUN_SLOW_TESTS: '1'
        run: |
          if grep -qx 'test/patient-imports-load.e2e-spec.ts' e2e-shard-${{ matrix.shard }}.txt; then
            npm run test:e2e -- test/patient-imports-load
          else
            echo "La prueba de carga corre en otro shard."
          fi

      - name: Duración del shard
        if: ${{ always() }}
        run: .github/scripts/report-job-duration.sh "E2E ${{ matrix.shard }}/${{ matrix.total }}" ${{ matrix.timeout }}

  # DX-396: cada spec e2e corre en exactamente un shard. Compara la unión de
  # las listas que subió cada shard con `jest --listTests` completo: falla si
  # un spec falta, sobra o se repite (p. ej. si `total` no cuadra con `shard`).
  e2e-shards:
    name: E2E, reparto de specs entre shards
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-shard-*
          path: e2e-shards
          merge-multiple: true
      - name: Cada spec e2e en exactamente un shard
        run: |
          npx jest --config ./test/jest-e2e.json --listTests \
            | sed "s|^$GITHUB_WORKSPACE/||" | sort > e2e-all.txt
          .github/scripts/check-e2e-shards.sh e2e-all.txt e2e-shards/e2e-shard-*.txt


  # DX-113: en un Postgres gestionado (RDS, Cloud SQL…) el owner de las tablas
  # NO es superusuario ni tiene BYPASSRLS, y con RLS FORCE queda sujeto a la
  # RLS. Este job reproduce ese despliegue desde cero: el superusuario de la
  # imagen solo hace de admin del proveedor (crea el owner y la base); todo lo
  # demás corre como el owner o como la app. Ver README, «Despliegue: roles de
  # la BD».
  owner-nosu:
    name: Migraciones con owner sin superusuario (Postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores SOLO de test, ficticios (como en el job de integración).
      DATABASE_URL: postgresql://dentalix_app:dentalix_app@localhost:5432/dentalix_nosu?schema=public
      DIRECT_URL: postgresql://dentalix_owner:dentalix_owner@localhost:5432/dentalix_nosu?schema=public
      # Admin del clúster: solo lo usan los specs owner-nosu para crear bases
      # desechables y cargar filas saltando la RLS.
      OWNER_NOSU_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JWT_ACCESS_SECRET: solo-test-ci-access-4f1d9b2e7a6c3058e1b4d7a0c9f2e6b3
      JWT_REFRESH_SECRET: solo-test-ci-refresh-8c2a5e9f1b7d4063a2e5c8f1b4d7a0e9
      JWT_ACCESS_TTL: 900s
      JWT_REFRESH_TTL: 30d
      EXCHANGE_APP_ID: ''
      EXCHANGE_BASE_URL: https://openexchangerates.org/api
      TENANT_BASE_DOMAINS: dentalix.app,localhost
      TRUST_PROXY: 'false'
      STORAGE_DIR: ./storage-test
      FILES_PUBLIC_BASE_URL: http://localhost:3000/api/v1/files
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      # DX-226: el servidor arranca fuera de UTC (como un gestionado en otra
      # región). La migración fija UTC en los roles y en la base, y
      # db:check-force comprueba que dentalix_app arranca en UTC.
      - name: Zona del servidor fuera de UTC
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres \
            -c "ALTER SYSTEM SET timezone = 'America/Bogota'" -c "SELECT pg_reload_conf()"
          test "$(psql -h localhost -U postgres -d postgres -tAc 'SHOW TimeZone')" = America/Bogota

      # Privilegios mínimos del owner (README): LOGIN, CREATEROLE (crea
      # dentalix_app y los roles NOLOGIN de las migraciones) y dueño de la base.
      - name: Crear el owner sin SUPERUSER ni BYPASSRLS
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres <<'SQL'
          CREATE ROLE dentalix_owner LOGIN PASSWORD 'dentalix_owner'
            NOSUPERUSER NOBYPASSRLS CREATEROLE NOCREATEDB NOREPLICATION;
          CREATE DATABASE dentalix_nosu OWNER dentalix_owner;
          SQL
          test "$(psql -h localhost -U postgres -d postgres -tAc \
            "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = 'dentalix_owner'")" = f

      - name: Crear el rol de la app como el owner (docker/prod/create-app-role.sql)
        env:
          PGPASSWORD: dentalix_owner
        run: psql -v ON_ERROR_STOP=1 -h localhost -U dentalix_owner -d dentalix_nosu -v app_password=dentalix_app -f docker/prod/create-app-role.sql

      - name: Aplicar todas las migraciones desde cero con el owner
        run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run seed:demo
      # DX-083: con la base sembrada, dentalix_app (DATABASE_URL) no ve ningún
      # paciente sin `app.current_tenant`, aunque los hay (el admin del
      # clúster, superusuario, sí los ve).
      - name: dentalix_app no se salta la RLS sin app.current_tenant
        env:
          PGPASSWORD: postgres
        run: |
          total="$(psql -h localhost -U postgres -d dentalix_nosu -tAc 'SELECT count(*) FROM patients')"
          seen="$(psql "${DATABASE_URL%%\?*}" -tAc 'SELECT count(*) FROM patients')"
          echo "pacientes: $total en la base; dentalix_app sin clínica ve $seen"
          test "$total" -gt 0
          test "$seen" = 0
      # DX-431 (OPS-012): create-app-role.sql fija los topes de la sesión de la
      # app; conectado COMO dentalix_app, tras migrar y sembrar (seed:demo ya
      # corrió con ellos).
      - name: dentalix_app con statement_timeout 15s e idle_in_transaction_session_timeout 150s
        run: |
          app_url="${DATABASE_URL%%\?*}"
          st="$(psql "$app_url" -tAc 'SHOW statement_timeout')"
          idle="$(psql "$app_url" -tAc 'SHOW idle_in_transaction_session_timeout')"
          echo "dentalix_app: statement_timeout=$st idle_in_transaction_session_timeout=$idle"
          test "$st" = 15s
          test "$idle" = 150s
      # DX-134: la comprobación del runbook tras desplegar (README), como el owner.
      - name: Comprobar FORCE tras migrar (db:check-force)
        run: npm run db:check-force

      # FORCE en toda tabla con tenantId (y en toda tabla con RLS), leído de
      # pg_class con el owner real.
      - name: Comprobar RLS FORCE tras migrar
        run: npx jest --config ./test/jest-int.json --runInBand test/rls-catalog.int-spec.ts

      # Migraciones de datos con filas previas, despachador de email, FK con
      # filas huérfanas ocultas, create-app-role.sql sin contraseña, dos
      # owners en el mismo clúster (DX-134) y membresías en otras clínicas
      # vistas por la app (DX-143).
      - run: npm run test:owner-nosu

  # DX-083: la imagen de producción (Dockerfile) se construye en cada PR, SIN
  # publicarla, y pasa la prueba de humo contra el Postgres del job (clúster
  # nuevo): owner distinto de `dentalix`, create-app-role.sql, migrate deploy,
  # seed y audit:purge desde la imagen (sin devDependencies), la API con
  # NODE_ENV=production responde /api/v1/health y sale con 0 tras SIGTERM.
  docker-image:
    name: Imagen Docker (build y humo)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: docker build (sin publicar)
        run: docker build -t dentalix-api:ci .
      - name: Sin .env, sin devDependencies y sin root en la imagen
        run: |
          docker run --rm dentalix-api:ci sh -c '
            test "$(id -u)" != 0 &&
            ! ls -a /app | grep -q "^\.env" &&
            test ! -e node_modules/ts-node &&
            test ! -e node_modules/country-state-city &&
            test ! -e node_modules/@nestjs/cli &&
            test -f dist/main.js && test -f dist/scripts/prisma/seed.js'
      - name: Prueba de humo de la imagen
        env:
          PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: .github/scripts/docker-smoke-api.sh dentalix-api:ci
