services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dentalix
      POSTGRES_PASSWORD: dentalix
      POSTGRES_DB: dentalix
    ports: ['5442:5432']   # 5442 en host: evita choque con postgresql@17 local en 5432
    volumes:
      - 'dentalix_db:/var/lib/postgresql/data'
      - './docker/db-init:/docker-entrypoint-initdb.d:ro'
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: dentalix
      POSTGRES_PASSWORD: dentalix
      POSTGRES_DB: dentalix_test
    ports: ['5433:5432']
    volumes:
      - './docker/db-init:/docker-entrypoint-initdb.d:ro'
  # DX-084: almacén de ficheros S3 compatible para local y e2e
  # (STORAGE_DRIVER=s3, ver README «Ficheros en un bucket S3»). API en :9000 y
  # consola en :9001. Credenciales SOLO locales: la API las rechaza en
  # producción.
  minio:
    # DX-251: `minio/minio` ya no se puede descargar de Docker Hub. MinIO
    # compilado por Chainguard, fijado por digest (RELEASE.2026-09-22T19-25-18Z);
    # el mismo que usa la CI (.github/scripts/start-test-s3.sh).
    image: cgr.dev/chainguard/minio:latest@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: dentalix-minio
      MINIO_ROOT_PASSWORD: dentalix-minio-local
      # Alias `local` del `mc` de la imagen para el healthcheck.
      MC_HOST_local: http://dentalix-minio:dentalix-minio-local@localhost:9000
      # DX-259: la web sube los documentos directamente al bucket (POST
      # prefirmado por XHR desde http://<clínica>.localhost:3001), así que el
      # navegador necesita CORS. MinIO no tiene CORS por bucket (PutBucketCors
      # da NotImplemented): es de todo el servidor. En local, cualquier origen
      # (el bucket sigue privado: sin la política firmada no se sube nada). En
      # producción, CORS del bucket solo con los orígenes de la web (README,
      # «Subida directa al bucket»).
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
    ports: ['9000:9000', '9001:9001']
    volumes:
      - 'dentalix_minio:/data'
    healthcheck:
      # La imagen no trae curl; trae `mc` y su alias `local`.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
  # Crea los buckets privados (local y test) con versionado, como en producción,
  # y (DX-259, DX-274) las reglas de ciclo de vida que borran a las 24 h las
  # subidas directas que no llegaron a `complete` o al alta del gasto (prefijos
  # patient-documents/pending/ y expense-receipts/pending/). `mc ilm import`
  # REEMPLAZA todas las reglas: van las dos en el mismo JSON.
  minio_init:
    # La imagen de MinIO trae `mc` y `sh` (minio/mc tampoco se descarga ya).
    image: cgr.dev/chainguard/minio:latest@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 dentalix-minio dentalix-minio-local &&
        for b in dentalix-local dentalix-test; do
          mc mb --ignore-existing local/$$b && mc version enable local/$$b && mc anonymous set none local/$$b &&
          echo '{"Rules":[{"ID":"pending-24h","Status":"Enabled","Filter":{"Prefix":"patient-documents/pending/"},"Expiration":{"Days":1},"NoncurrentVersionExpiration":{"NoncurrentDays":1}},{"ID":"expense-receipts-pending-24h","Status":"Enabled","Filter":{"Prefix":"expense-receipts/pending/"},"Expiration":{"Days":1},"NoncurrentVersionExpiration":{"NoncurrentDays":1}}]}' | mc ilm import local/$$b;
        done
volumes:
  dentalix_db:
  dentalix_minio:
