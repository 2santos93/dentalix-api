services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dentalix
      POSTGRES_PASSWORD: dentalix
      POSTGRES_DB: dentalix
    ports: ['5442:5432']   # 5442 en host: evita choque con postgresql@17 local en 5432
    volumes:
      - 'dentalix_db:/var/lib/postgresql/data'
      - './docker/db-init:/docker-entrypoint-initdb.d:ro'
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: dentalix
      POSTGRES_PASSWORD: dentalix
      POSTGRES_DB: dentalix_test
    ports: ['5433:5432']
    volumes:
      - './docker/db-init:/docker-entrypoint-initdb.d:ro'
  # DX-084: almacén de ficheros S3 compatible para local y e2e
  # (STORAGE_DRIVER=s3, ver README «Ficheros en un bucket S3»). API en :9000 y
  # consola en :9001. Credenciales SOLO locales: la API las rechaza en
  # producción.
  minio:
    # DX-251: `minio/minio` ya no se puede descargar de Docker Hub. MinIO
    # compilado por Chainguard, fijado por digest (RELEASE.2026-09-22T19-25-18Z);
    # el mismo que usa la CI (.github/scripts/start-test-s3.sh).
    image: cgr.dev/chainguard/minio:latest@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: dentalix-minio
      MINIO_ROOT_PASSWORD: dentalix-minio-local
      # Alias `local` del `mc` de la imagen para el healthcheck.
      MC_HOST_local: http://dentalix-minio:dentalix-minio-local@localhost:9000
    ports: ['9000:9000', '9001:9001']
    volumes:
      - 'dentalix_minio:/data'
    healthcheck:
      # La imagen no trae curl; trae `mc` y su alias `local`.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
  # Crea los buckets privados (local y test) con versionado, como en producción.
  minio_init:
    # La imagen de MinIO trae `mc` y `sh` (minio/mc tampoco se descarga ya).
    image: cgr.dev/chainguard/minio:latest@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 dentalix-minio dentalix-minio-local &&
        for b in dentalix-local dentalix-test; do
          mc mb --ignore-existing local/$$b && mc version enable local/$$b && mc anonymous set none local/$$b;
        done
volumes:
  dentalix_db:
  dentalix_minio:
